<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="246.5" height="246.5" rx="55.25" fill="none" stroke="#1e2c42" stroke-width="1.5"/>
  <circle cx="128" cy="118" r="92" fill="url(#glow)"/>

  <!-- outer temperature ring -->
  <circle cx="128" cy="118" r="86" fill="none" stroke="#162235" stroke-width="13"/>
  <path d="M 128 32 A 86 86 0 0 1 210.5 158" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"/>
  <path d="M 45.5 158 A 86 86 0 0 1 81 44" fill="none" stroke="#22d3ee" stroke-width="13" stroke-linecap="round" opacity="0.35"/>

  <!-- fan blades -->
  <g transform="translate(128 118)">
    <g fill="url(#blade)">
      <g transform="rotate(0)">
        <path d="M 0 -10 C 22 -16 55 -6 58 22 C 48 30 30 24 22 12 C 12 16 2 8 0 -10 Z"/>
      </g>
      <g transform="rotate(72)">
        <path d="M 0 -10 C 22 -16 55 -6 58 22 C 48 30 30 24 22 12 C 12 16 2 8 0 -10 Z"/>
      </g>
      <g transform="rotate(144)">
        <path d="M 0 -10 C 22 -16 55 -6 58 22 C 48 30 30 24 22 12 C 12 16 2 8 0 -10 Z"/>
      </g>
      <g transform="rotate(216)">
        <path d="M 0 -10 C 22 -16 55 -6 58 22 C 48 30 30 24 22 12 C 12 16 2 8 0 -10 Z"/>
      </g>
      <g transform="rotate(288)">
        <path d="M 0 -10 C 22 -16 55 -6 58 22 C 48 30 30 24 22 12 C 12 16 2 8 0 -10 Z"/>
      </g>
    </g>
    <circle r="24" fill="#0b1422" stroke="#2c405c" stroke-width="3"/>
    <!-- thermometer -->
    <rect x="-5" y="-15" width="10" height="21" rx="5" fill="#0f1a2b" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="0" cy="11" r="8.5" fill="#fb7185"/>
    <rect x="-1.6" y="-8" width="3.2" height="17" rx="1.6" fill="#fb7185"/>
  </g>

  <!-- small monitor ticks -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <line x1="128" y1="24" x2="128" y2="32"/>
    <line x1="222" y1="118" x2="214" y2="118"/>
    <line x1="34" y1="118" x2="42" y2="118"/>
  </g>
</svg>
